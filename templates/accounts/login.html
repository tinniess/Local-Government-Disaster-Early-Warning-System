{% extends 'base_auth.html' %}
{% block title %}Login — LGU EWS{% endblock %}
{% block content %}
<div class="login-header">
  <div class="shield-icon">
    <i class="bi bi-shield-exclamation" style="font-size:2rem;color:#fff;"></i>
  </div>
  <h4>LGU Disaster Early Warning System</h4>
  <small>Municipal Disaster Risk Reduction Portal</small>
</div>

<div class="login-body">
  {% if form.errors %}
  <div class="alert alert-danger d-flex align-items-center gap-2 mb-3">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span>Invalid username or password. Please try again.</span>
  </div>
  {% endif %}

  <form method="post" novalidate>
    {% csrf_token %}
    <!-- Honeypot: hidden from humans, traps bots -->
    <input type="text" name="phonenumber" style="display:none!important" tabindex="-1" autocomplete="off" aria-hidden="true">

    <div class="mb-3">
      <label class="form-label">Username</label>
      <div class="input-icon-wrap">
        <i class="bi bi-person"></i>
        <input type="text" name="username" class="form-control" placeholder="Enter your username" autofocus required>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label">Password</label>
      <div class="input-icon-wrap">
        <i class="bi bi-lock"></i>
        <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
      </div>
    </div>

    <button type="submit" class="btn-login">
      <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
    </button>
  </form>
</div>
{% endblock %}
