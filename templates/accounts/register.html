{% extends 'base.html' %}
{% block title %}Add User{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-danger text-white"><h5 class="mb-0"><i class="bi bi-person-plus me-2"></i>Add New User</h5></div>
      <div class="card-body p-4">
        <form method="post">{% csrf_token %}
          <div class="row g-3">
            {% for field in form %}
            <div class="col-md-6">
              <label class="form-label fw-semibold">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
            </div>
            {% endfor %}
          </div>
          <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-danger"><i class="bi bi-check me-1"></i>Create User</button>
            <a href="{% url 'user_list' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
