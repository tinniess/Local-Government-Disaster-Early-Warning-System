{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LGU EWS — Login{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #7f0000 0%, #c0392b 40%, #e74c3c 70%, #ff6b6b 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      position: relative; overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
    }
    .login-wrapper {
      width: 100%; max-width: 460px;
      padding: 1.5rem;
      position: relative; z-index: 1;
    }
    .login-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, #c0392b, #e74c3c);
      padding: 2.5rem 2rem;
      text-align: center; color: #fff;
    }
    .login-header .shield-icon {
      width: 70px; height: 70px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%; display: flex;
      align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      border: 2px solid rgba(255,255,255,0.3);
    }
    .login-header h4 { font-size: 1.3rem; font-weight: 700; margin-bottom: .25rem; }
    .login-header small { opacity: .8; font-size: .85rem; }
    .login-body { padding: 2rem 2rem 1.5rem; }
    .form-label { font-weight: 600; font-size: .875rem; color: #444; margin-bottom: .4rem; }
    .form-control {
      border: 1.5px solid #e0e0e0; border-radius: 10px;
      padding: .65rem 1rem; font-size: .9rem;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-control:focus {
      border-color: #e74c3c;
      box-shadow: 0 0 0 3px rgba(231,76,60,.15);
      outline: none;
    }
    .input-icon-wrap { position: relative; }
    .input-icon-wrap .bi {
      position: absolute; left: .85rem; top: 50%;
      transform: translateY(-50%);
      color: #aaa; font-size: 1rem;
    }
    .input-icon-wrap .form-control { padding-left: 2.5rem; }
    .btn-login {
      background: linear-gradient(135deg, #c0392b, #e74c3c);
      border: none; border-radius: 10px; color: #fff;
      font-weight: 700; font-size: .95rem;
      padding: .75rem; width: 100%;
      transition: opacity .2s, transform .1s;
      letter-spacing: .3px;
    }
    .btn-login:hover { opacity: .92; transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }
    .login-footer {
      background: #fafafa; border-top: 1px solid #f0f0f0;
      padding: .85rem 2rem; text-align: center;
      color: #aaa; font-size: .78rem;
    }
    .alert { border-radius: 10px; font-size: .875rem; }
    .powered-tag {
      position: fixed; bottom: 1rem; right: 1rem;
      color: rgba(255,255,255,.5); font-size: .75rem;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      {% block content %}{% endblock %}
    </div>
  </div>
  <div class="powered-tag"><i class="bi bi-shield-check me-1"></i>Secured by django-axes</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
