{% extends 'base.html' %}

{% block title %}Report Submitted — LGU EWS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body text-center p-5">

                <i class="bi bi-check-circle-fill text-success"
                   style="font-size:4rem;"></i>

                <h2 class="mt-3">Report Submitted Successfully</h2>

                <p class="text-muted">
                    Thank you for helping your community.
                    Your incident report has been received and will be reviewed by the LGU.
                </p>

                <a href="{% url 'dashboard' %}"
                   class="btn btn-primary mt-3">
                    Return to Dashboard
                </a>

            </div>
        </div>
    </div>
</div>
{% endblock %}
