{% extends 'base.html' %}
{% block title %}{{ action }} Incident Report{% endblock %}
{% block page_title %}<i class="bi bi-house-door me-2 text-danger"></i>{{ action }} Incident Report{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-9">
        <div class="card">
            <div class="card-header bg-white">
                <strong>Incident Report</strong>
            </div>

            <div class="card-body p-4">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-danger px-4">
                            Submit Report
                        </button>

                        <a href="{% url 'citizen_report_list' %}"
                           class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
